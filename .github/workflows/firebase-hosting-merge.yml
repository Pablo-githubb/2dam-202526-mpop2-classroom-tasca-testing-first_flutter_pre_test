name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Run Flutter Tests
        run: flutter test
    # Build web de Flutter
      - run: flutter build webd
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYFIRSTFLUTTERBYPABLO }}
          channelId: live
          projectId: myfirstflutterbypablo
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
